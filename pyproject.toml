[project]
name = "evalkit"
version = "0.1.0"
description = "Agent-agnostic eval kit for Wonderful agents: run, collect, judge, report, explore."
requires-python = ">=3.12"
dependencies = [
    "langchain-openai==1.3.2",
    "pydantic==2.13.3",
    "fastapi==0.133.0",
    "uvicorn==0.30.6",
]

[project.scripts]
evalkit = "evalkit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["evalkit*"]
