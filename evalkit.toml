# evalkit defaults. No secrets here — LLM credentials are read at runtime from
# the env file named below and are never logged or persisted.

[paths]
data_dir = "data"

[llm]
# Judge model. `claude-*` goes to Anthropic (adaptive thinking, tool-calling
# structured output); `gpt-5*`/`o*` use OpenAI's Responses API with `reasoning`,
# matching how the platform judge calls them.
model = "claude-sonnet-5"
# OpenAI reasoning models only.
reasoning_effort = "medium"
votes = 3
# Concurrent judge LLM calls across the whole process.
concurrency = 6
max_retries = 3
# Requests per second ceiling for judge calls (0 disables the limiter).
requests_per_second = 3.0
# Anthropic requires max_tokens, and it caps thinking + verdict together.
max_output_tokens = 24000
# Searched in order for the provider key the judge needs (OPENAI_API_KEY /
# ANTHROPIC_API_KEY). Read at runtime only, never logged or persisted.
env_files = [
    "~/GIT/wonderful/wonderful/env_files/agents.env",
    "~/GIT/wonderful/wonderful/env_files/controller.env",
]

[rubric]
# Criteria that make up the score (equal weight, median across votes).
required = ["grounding", "completeness", "clauses", "customer_care"]
# The score is the verdict; these only derive a binary read for comparing with
# the platform's pass/fail judge.
pass_threshold = 4.0
min_criterion_score = 3

# ---------------------------------------------------------------------------
# Agent profiles. `evalkit run --agent vera` picks one of these.
# ---------------------------------------------------------------------------

[agents.vera]
slug = "vera-interforze"
id = "37b7f505-162c-4abf-8f1c-9853d060b8f2"
wful_profile = "tim-enterprise-sandbox"
workspace = "2b85609f-8bf7-5a1b-9c67-e7907f0cb180"
repo = "~/GIT/wonderful/Vera/agent-vera"
# Default scenario set: the batch file listing the slugs to run.
batch = "v2_answerable"
concurrency = 4
rounds = 3
